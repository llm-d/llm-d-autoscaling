# Copy of blis-signal-lab autoscaling-kit/scenarios/router/pd-prefix.yaml (34b8b14) with the
# coord-disaggregation guide's nonCachedTokens 8192 (router/coord-disaggregation.values.yaml).
# The embedded router disaggregates when nonCached >= threshold (llm-d-router v1.0.0-blis.4).
# llm-d's deploy/config/pd-epp-config.yaml with its prefix-based-pd-decider: a request is
# disaggregated only when more than nonCachedTokens of its prompt are not in the decode pod's
# prefix cache; otherwise the decode pod serves it whole.
apiVersion: llm-d.ai/v1
kind: EndpointPickerConfig
plugins:
- type: approx-prefix-cache-producer
  parameters:
    maxPrefixTokensToMatch: 16384
    lruCapacityPerServer: 31250
- type: prefix-cache-scorer
- type: queue-scorer
- type: prefill-filter
- type: decode-filter
- type: max-score-picker
- type: prefix-based-pd-decider
  parameters:
    nonCachedTokens: 8192
- type: disagg-profile-handler
  parameters:
    deciders:
      prefill: prefix-based-pd-decider
schedulingProfiles:
- name: prefill
  plugins:
  - pluginRef: prefill-filter
  - pluginRef: max-score-picker
  - pluginRef: prefix-cache-scorer
    weight: 2
  - pluginRef: queue-scorer
    weight: 1
- name: decode
  plugins:
  - pluginRef: decode-filter
  - pluginRef: max-score-picker
  - pluginRef: prefix-cache-scorer
    weight: 2
  - pluginRef: queue-scorer
    weight: 1
