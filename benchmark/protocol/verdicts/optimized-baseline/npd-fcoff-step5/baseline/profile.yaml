# step 5 run mixshift, written by gen_load.py; do not edit by hand.
# mix-shift at 3.777 req/s, one phase per mix: 8192:256 needs 3, 2048:2048 needs 3, 256:4096 needs 3 replicas
# Run with --workload-file-path <this file> --dataset /requests/datasets/mixshift.csv
load:
  type: trace_replay
  trace:
    file: REPLACE_ENV_LLMDBENCH_RUN_DATASET_DIR/REPLACE_ENV_LLMDBENCH_RUN_DATASET_FILE
    format: AzurePublicDataset
  stages:
    - rate: 1
      duration: 3840
  request_timeout: 311
  stage_teardown_grace_seconds: 311
  num_workers: 4
  worker_max_concurrency: 512
api:
  type: completion
  streaming: true
server:
  type: vllm
  model_name: REPLACE_ENV_LLMDBENCH_DEPLOY_CURRENT_MODEL
  base_url: REPLACE_ENV_LLMDBENCH_HARNESS_STACK_ENDPOINT_URL
  ignore_eos: true
tokenizer:
  pretrained_model_name_or_path: REPLACE_ENV_LLMDBENCH_DEPLOY_CURRENT_TOKENIZER
data:
  type: random
  trace:
    file: REPLACE_ENV_LLMDBENCH_RUN_DATASET_DIR/REPLACE_ENV_LLMDBENCH_RUN_DATASET_FILE
    format: AzurePublicDataset
report:
  request_lifecycle:
    summary: false
    per_stage: true
    per_request: true
    per_request_fields:
      request: false
      response: false
      info: true
      response_chunks: false
      computed_metrics: false
  goodput:
    constraints:
      ttft: 2
      tpot: 0.05
storage:
  local_storage:
    path: /workspace
