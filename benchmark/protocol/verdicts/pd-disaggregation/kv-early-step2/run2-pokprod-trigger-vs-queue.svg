<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" font-family="Helvetica,Arial,sans-serif" font-size="12">
<title>P9: trigger query vs. ground-truth prefill queue, kv-early</title>
<desc>Line chart over about 4.5 minutes. The ground-truth prefill queue (sum(vllm:num_requests_waiting) read directly from the prefill pod) rises from 0 to over 3000 once load starts around 140 seconds. The ScaledObject's own trigger query, which additionally filters on role="prefill", returns an empty Prometheus result at every sample and so is plotted flat at 0 throughout, confirming step 1's P9 prediction that the role label does not exist on these series.</desc>
