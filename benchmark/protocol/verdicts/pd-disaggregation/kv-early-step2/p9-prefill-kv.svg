<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 424" font-family="Helvetica,Arial,sans-serif" font-size="12">
<title>P9: the prefill KV trigger reads 0 while KV usage passes its threshold</title>
<desc>Line chart over about 7 minutes. Prefill KV-cache usage read by pod name rises from 0.002 to 0.92 after load starts near 230 seconds, above the 0.80 threshold. The ScaledObject's own query, which filters on role="prefill", returns an empty result at every sample and is plotted at 0.</desc>
