<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" font-family="Helvetica,Arial,sans-serif" font-size="12">
<title>kv-early-role-fix: trigger responds to load and the pool scales out</title>
<desc>Line chart over about 4.5 minutes. The ScaledObject's vllm-queue-size trigger, now selecting by pod name (pod=~".*prefill.*") instead of the absent role label, climbs from 0 to over 1300 once the same load profile used in the P9 run starts. Vertical markers show when the prefill and decode Deployments' replica counts actually changed, confirming the autoscaler acted on this signal.</desc>
