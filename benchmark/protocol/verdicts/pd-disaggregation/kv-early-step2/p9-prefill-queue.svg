<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 424" font-family="Helvetica,Arial,sans-serif" font-size="12">
<title>P9: the prefill queue trigger reads 0 while the real queue grows</title>
<desc>Line chart over about 7 minutes. The prefill queue read by pod name rises from 0 to about 2970 waiting requests after load starts near 230 seconds. The ScaledObject's own query, which filters on role="prefill", returns an empty result at every sample and is plotted at 0. The threshold is 20.</desc>
<rect x="0" y="0" width="760" height="424" fill="white" />
<text x="380.0" y="22" text-anchor="middle" font-size="14" font-weight="bold">P9: the prefill queue trigger reads 0 while the real queue grows</text>
<line x1="70" y1="46" x2="100" y2="46" stroke="black" stroke-width="2" />
<text x="106" y="50">prefill queue, selected by pod name (max)</text>
<line x1="70" y1="64" x2="100" y2="64" stroke="#555" stroke-width="2" stroke-dasharray="6,4" />
<text x="106" y="68">vllm-queue-size trigger as rendered (role="prefill"); empty, read as 0</text>
<line x1="70" y1="84" x2="70" y2="364" stroke="black" />
<line x1="70" y1="364" x2="730" y2="364" stroke="black" />
