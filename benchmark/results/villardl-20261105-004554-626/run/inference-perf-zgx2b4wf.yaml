







apiVersion: v1
kind: Pod
metadata:
  name: inference-perf-zgx2b4wf
  namespace: npdfc
  labels:
    app: "llmdbench-harness-launcher"
    function: load_generator
    llmdbench.ai/treatment: "dlqb4m"
spec:
  containers:
  - name: harness
    image: ghcr.io/llm-d/llm-d-benchmark:v0.8.9
    imagePullPolicy: IfNotPresent
    command: ["sh", "-c"]
    args:
    - >-
      for script in /workspace/harnesses/*; do
        [ -f "$script" ] || continue;
        cp "$script" /usr/local/bin/;
        chmod +x "/usr/local/bin/$(basename "$script")";
      done;
      export LLMDBENCH_RUN_EXPERIMENT_HARNESS=inference-perf-llm-d-benchmark.sh; export LLMDBENCH_RUN_EXPERIMENT_ANALYZER=inference-perf-analyze_results.sh; export LLMDBENCH_RUN_EXPERIMENT_RESULTS_DIR=/requests/inference-perf-1793857567-dlqb4m_1; export LLMDBENCH_CONTROL_WORK_DIR=/requests/inference-perf-1793857567-dlqb4m_1; export LLMDBENCH_RUN_EXPERIMENT_HARNESS_WORKLOAD_NAME=stair.yaml; export LLMDBENCH_HARNESS_START=$(date -u +%Y-%m-%dT%H:%M:%SZ); export LLMDBENCH_HARNESS_ARGS='--workload stair.yaml'; export LLMDBENCH_HARNESS_VERSION=$(grep '^inference-perf:' /workspace/repos.txt 2>/dev/null | cut -d' ' -f3 || echo 'unknown'); export LLMDBENCH_RUN_DATASET_URL=/requests/datasets/kind-stair.csv; llm-d-benchmark.sh
    resources:
      limits:
        cpu: "2"
        memory: 128Gi
      requests:
        cpu: "2"
        memory: 4Gi
    env:
    # Stage markers are logged in local time, then compared against `date -u`
    # scrape timestamps when clipping per-stage series.
    - name: TZ
      value: "UTC"
    - name: LLMDBENCH_RUN_EXPERIMENT_LAUNCHER
      value: "1"
    - name: LLMDBENCH_MAGIC_ENVAR
      value: "harness_pod"
    - name: LLMDBENCH_DEPLOY_METHODS
      value: "modelservice"
    - name: LLMDBENCH_CLUSTER_TYPE
      value: "Kind"
    - name: LLMDBENCH_RUN_WORKSPACE_DIR
      value: "/workspace"
    - name: LLMDBENCH_CONTROL_WORK_DIR
      value: "/requests/inference-perf-1793857567-dlqb4m_1"
    - name: LLMDBENCH_DEPLOY_CURRENT_MODEL
      value: "Qwen/Qwen3-8B"
    - name: LLMDBENCH_DEPLOY_CURRENT_TOKENIZER
      value: "Qwen/Qwen3-8B"
    - name: LLMDBENCH_HARNESS_STACK_ENDPOINT_URL
      value: "http://10.96.93.110:80"
    - name: LLMDBENCH_HARNESS_STACK_TYPE
      value: "llm-d"
    - name: LLMDBENCH_HARNESS_NAME
      value: "inference-perf"
    - name: LLMDBENCH_RUN_EXPERIMENT_ID
      value: "inference-perf-1793857567-dlqb4m"
    - name: LLMDBENCH_DESCRIPTION_TEXT
      value: ""
    - name: LLMDBENCH_DESCRIPTION_KEYWORDS
      value: ""
    - name: RAYON_NUM_THREADS
      value: "4"
    - name: HOME
      value: "/requests/.home"
    - name: HF_HOME
      value: "/requests/.cache/huggingface"
    - name: XDG_CACHE_HOME
      value: "/requests/.cache"
    - name: POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    - name: POD_UID
      valueFrom:
        fieldRef:
          fieldPath: metadata.uid
    - name: LLMDBENCH_VLLM_COMMON_NAMESPACE
      value: "npdfc"
    - name: LLMDBENCH_BASE64_CONTEXT_CONTENTS
      value: ""
    - name: LLMDBENCH_VLLM_COMMON_INFERENCE_PORT
      value: "8000"
    - name: LLMDBENCH_RUN_EXPERIMENT_RESULTS_DIR_PREFIX
      value: "/requests"
    - name: LLMDBENCH_HARNESS_STACK_NAME
      value: "qwen-qwe-9117f9be-qwen3-8b"
    - name: LLMDBENCH_VLLM_COMMON_METRICS_SCRAPE_ENABLED
      value: "false"
    - name: LLMDBENCH_VLLM_COMMON_METRICS_PORT
      value: "8200"
    - name: LLMDBENCH_VLLM_MONITORING_METRICS_PATH
      value: "/metrics"
    - name: LLMDBENCH_EPP_METRICS_SECRET
      value: "inference-gateway-sa-metrics-reader-secret"
    - name: LLMDBENCH_TIME_SERIES_METRICS
      value: >-
        ["vllm:kv_cache_usage_perc","vllm:gpu_cache_usage_perc","vllm:cpu_cache_usage_perc","vllm:gpu_memory_usage_bytes","vllm:cpu_memory_usage_bytes","container_memory_usage_bytes","DCGM_FI_DEV_GPU_UTIL","DCGM_FI_DEV_POWER_USAGE","vllm:num_requests_running","vllm:num_requests_waiting","vllm:prefix_cache_hits_total","vllm:prefix_cache_queries_total","vllm:external_prefix_cache_hits_total","vllm:external_prefix_cache_queries_total","vllm:prefix_cache_hit_rate","vllm:external_prefix_cache_hit_rate","vllm:kv_offload_total_bytes_total","vllm:kv_offload_total_time_total","vllm:nixl_xfer_time_seconds_sum","vllm:nixl_xfer_time_seconds_count","vllm:nixl_bytes_transferred_sum","vllm:nixl_bytes_transferred_count","vllm:num_preemptions_total","vllm:prompt_tokens_total","vllm:generation_tokens_total","inference_pool_average_kv_cache_utilization","inference_pool_average_queue_size","inference_pool_average_running_requests","inference_pool_ready_pods","llm_d_epp_flow_control_pool_saturation","llm_d_epp_flow_control_queue_size","llm_d_epp_request_running"]
    - name: LLMDBENCH_METRICS_EMBED_TIME_SERIES
      value: "true"
    - name: LLMDBENCH_METRICS_TS_MAX_POINTS
      value: "256"
    - name: LLMDBENCH_STANDALONE_ENABLED
      value: "false"
    - name: LLMDBENCH_STANDALONE_LAUNCHER_ENABLED
      value: "false"
    - name: LLMDBENCH_FMA_ENABLED
      value: "false"
    - name: LLMDBENCH_VLLM_COMMON_VLLM_LOAD_FORMAT
      value: "auto"
    volumeMounts:
    - name: results
      mountPath: /requests
    - name: inference-perf-profiles
      mountPath: /workspace/profiles/inference-perf
    - name: harness-scripts
      mountPath: /workspace/harnesses
  volumes:
  - name: results
    persistentVolumeClaim:
      claimName: workload-pvc
  - name: inference-perf-profiles
    configMap:
      name: inference-perf-profiles
  - name: harness-scripts
    configMap:
      name: llmdbench-harness-scripts
      defaultMode: 0755
  serviceAccountName: inference-perf-runner
  restartPolicy: Never