        value: "INFO"
      - name: VLLM_HTTP_TIMEOUT_KEEP_ALIVE
        value: "120"
      - name: VLLM_ALLOW_LONG_MAX_MODEL_LEN
        value: "1"
      - name: VLLM_SERVER_DEV_MODE
        value: "1"
      - name: VLLM_INFERENCE_PORT
        value: "8000"
      - name: VLLM_METRICS_PORT
        value: "8200"
      - name: VLLM_BLOCK_SIZE
        value: "64"
      - name: VLLM_MAX_MODEL_LEN
        value: "16384"
      - name: VLLM_LOAD_FORMAT
        value: "auto"
      - name: VLLM_ACCELERATOR_MEM_UTIL
        value: "0.5"
      - name: VLLM_MAX_NUM_SEQ
        value: "256"
      - name: VLLM_TENSOR_PARALLELISM
        value: "1"
      - name: VLLM_MAX_NUM_BATCHED_TOKENS
        value: "256"
      - name: VLLM_NIXL_SIDE_CHANNEL_HOST
        valueFrom:
          fieldRef:
            fieldPath: status.podIP
      - name: VLLM_NIXL_SIDE_CHANNEL_PORT
        value: "5557"
      - name: UCX_TLS
        value: "sm,cuda_ipc,cuda_copy,tcp"
      - name: UCX_SOCKADDR_TLS_PRIORITY
        value: "tcp"
      - name: POD_IP
        valueFrom:
          fieldRef:
            apiVersion: v1
            fieldPath: status.podIP
      - name: LLMDBENCH_POD_NS
        valueFrom:
          fieldRef:
            fieldPath: metadata.namespace
      - name: PYTHONPATH
        value: "/plugins"
      - name: VLLM_CPU_KVCACHE_SPACE
        value: "15"
      - name: VLLM_CPU_OMP_THREADS_BIND
        value: "0-3"
      - name: HF_HOME
        value: "/tmp/huggingface"

    ports:
      - containerPort: 8200
        name: metrics
        protocol: TCP
    resources:
      limits:
        memory: 20Gi
        cpu: "4"
      requests:
        memory: 20Gi
        cpu: "4"
    extraConfig:
      startupProbe:
        httpGet:
          path: /health
          port: 8200
        failureThreshold: 60
        initialDelaySeconds: 30
        periodSeconds: 30
        timeoutSeconds: 5
      livenessProbe:
        tcpSocket:
          port: 8200
        failureThreshold: 10
        periodSeconds: 5
        timeoutSeconds: 15
      readinessProbe:
        httpGet:
          path: /health
          port: 8200
        failureThreshold: 10
        periodSeconds: 5
        timeoutSeconds: 15
    volumeMounts:
      - name: dshm
        mountPath: /dev/shm
      - name: plugins
        mountPath: /plugins
      - name: vllm-sim-model-config
        mountPath: /model
        readOnly: true

  volumes:
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 500Mi
    - name: plugins
      emptyDir: {}
    - name: vllm-sim-model-config
      configMap:
        name: vllm-sim-model-config

  monitoring:
    podmonitor:
      enabled: true
      portName: "metrics"
      path: "/metrics"
      interval: "15s"
      metricRelabelings:


