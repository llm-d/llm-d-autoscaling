extraObjects:
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata:
      name: allow-thanos-querier-api-access-lionel-bench-model-sim-32b-pd-token
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: allow-thanos-querier-api-access
    subjects:
    - kind: ServiceAccount
      name: keda-prometheus-auth
      namespace: lionel-bench-model-sim-32b-pd-token
  - apiVersion: v1
    data:
      config.json: |
        {
          "architectures": ["SimulatedForCausalLM"],
          "model_type": "qwen3",
          "hidden_size": 5120,
          "num_hidden_layers": 64,
          "num_attention_heads": 64,
          "num_key_value_heads": 8,
          "head_dim": 128,
          "intermediate_size": 25600,
          "vocab_size": 151936,
          "max_position_embeddings": 40960,
          "eos_token_id": 151645,
          "torch_dtype": "bfloat16",
          "latency": {
            "type": "physics",
            "hardware": {
              "peak_tflops": 989.0,
