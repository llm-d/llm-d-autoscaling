fullnameOverride: qwen-qwe-9117f9be-qwen3-8b


schedulerName: default-scheduler

modelArtifacts:
  name: Qwen/Qwen3-8B
  uri: hf://Qwen/Qwen3-8B
  size: 20Gi
  mountPath: /model-cache
  labels:
    llm-d.ai/inferenceServing: "true"
    llm-d.ai/model: qwen-qwe-9117f9be-qwen3-8b
    llm-d.ai/guide: "optimized-baseline"

multinode: false

accelerator:
  type: cpu

  dra: false


routing:
  servicePort: 8000
  proxy:
    enabled: false
    image: "ghcr.io/llm-d/llm-d-router-disagg-sidecar:v0.11.0"
    imagePullPolicy: Always
    targetPort: 8200
    connector: nixlv2
    secure: false
    zapEncoder: json
    zapLogLevel: debug
    debugLevel: 3


decode:
  create: true
  replicas: 1

  autoscaling:
    enabled: false





  parallelism:
    tensor: 1
    data: 1
    dataLocal: 1
    workers: 1

  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: kubernetes.io/os
            operator: In
            values:
            - "linux"




  accelerator:
    dra: false





  initContainers:
    - name: install-plugin
      image: ghcr.io/lionelvillard/vllm-sim-deps:v0.3.0
      imagePullPolicy: IfNotPresent
      command:
      - sh
      - -c
      - cp -r /plugins/* /mnt/plugins/
      env:
      - name: VLLM_IS_DECODE
        value: "1"
      - name: HOME
        value: "/tmp"
      - name: USER
        value: "llm-d"
      - name: MODEL_SERVE_REF
        value: "Qwen/Qwen3-8B"
      - name: MODEL_NAME
        value: "Qwen/Qwen3-8B"
      - name: MODEL_PATH
        value: "models/Qwen/Qwen3-8B"
      - name: VLLM_CACHE_ROOT
        value: "/tmp/vllm"
      - name: VLLM_WORKER_MULTIPROC_METHOD
        value: "spawn"
      - name: VLLM_LOGGING_LEVEL
        value: "INFO"
      - name: VLLM_HTTP_TIMEOUT_KEEP_ALIVE
        value: "120"
      - name: VLLM_ALLOW_LONG_MAX_MODEL_LEN
        value: "1"
      - name: VLLM_SERVER_DEV_MODE
        value: "1"
      - name: VLLM_INFERENCE_PORT
        value: "8000"
      - name: VLLM_METRICS_PORT
        value: "8200"
      - name: VLLM_BLOCK_SIZE
        value: "32"
      - name: VLLM_MAX_MODEL_LEN
        value: "32768"
      - name: VLLM_LOAD_FORMAT
        value: "auto"
      - name: VLLM_ACCELERATOR_MEM_UTIL
        value: "0"
      - name: VLLM_MAX_NUM_SEQ
        value: "256"
      - name: VLLM_TENSOR_PARALLELISM
        value: "1"
      - name: VLLM_MAX_NUM_BATCHED_TOKENS
        value: "256"
      - name: VLLM_NIXL_SIDE_CHANNEL_HOST
        valueFrom:
          fieldRef:
            fieldPath: status.podIP
      - name: VLLM_NIXL_SIDE_CHANNEL_PORT
        value: "5557"
      - name: UCX_TLS
        value: "sm,cuda_ipc,cuda_copy,tcp"
      - name: UCX_SOCKADDR_TLS_PRIORITY
        value: "tcp"
      - name: POD_IP
        valueFrom:
          fieldRef:
            apiVersion: v1
            fieldPath: status.podIP
      - name: LLMDBENCH_POD_NS
        valueFrom:
          fieldRef:
            fieldPath: metadata.namespace
      - name: PYTHONPATH
        value: "/plugins"
      - name: VLLM_SIM_MULTIPROC_METHOD
        value: "spawn"
      - name: VLLM_ENABLE_V1_MULTIPROCESSING
        value: "0"
      - name: VLLM_CPU_KVCACHE_SPACE
        value: "1"
      - name: VLLM_CPU_OMP_THREADS_BIND
        value: "nobind"
      - name: OMP_NUM_THREADS
        value: "1"
      - name: HF_HOME
        value: "/tmp/huggingface"

      volumeMounts:
      - mountPath: /mnt/plugins
        name: plugins


  containers:
  - name: "vllm"
    image: "docker.io/vllm/vllm-openai-cpu:v0.31.0@sha256:045fb648a61cfcd32d4b9ca5d0c391013afadae0178d2e23ac292597f2f64036"
    imagePullPolicy: IfNotPresent
    mountModelVolume: false
    modelCommand: custom
    command:
      - /bin/bash
      - '-c'
    args:
      - |
        /bin/true ; exec vllm serve /model --tokenizer=Qwen/Qwen3-8B --served-model-name=Qwen/Qwen3-8B --load-format=dummy --generation-config=vllm --host=0.0.0.0 --port=$VLLM_INFERENCE_PORT --max-model-len=32768 --max-num-batched-tokens=8192 --max-num-seqs=1024 --block-size=32 --num-gpu-blocks-override=12400 --distributed-executor-backend=uni --no-enable-log-requests --disable-uvicorn-access-log
    env:
      - name: VLLM_IS_DECODE
        value: "1"
      - name: HOME
        value: "/tmp"
      - name: USER
        value: "llm-d"
      - name: MODEL_SERVE_REF
        value: "Qwen/Qwen3-8B"
      - name: MODEL_NAME
        value: "Qwen/Qwen3-8B"
      - name: MODEL_PATH
        value: "models/Qwen/Qwen3-8B"
      - name: VLLM_CACHE_ROOT
        value: "/tmp/vllm"
      - name: VLLM_WORKER_MULTIPROC_METHOD
        value: "spawn"
      - name: VLLM_LOGGING_LEVEL
        value: "INFO"
      - name: VLLM_HTTP_TIMEOUT_KEEP_ALIVE
        value: "120"
      - name: VLLM_ALLOW_LONG_MAX_MODEL_LEN
        value: "1"
      - name: VLLM_SERVER_DEV_MODE
        value: "1"
      - name: VLLM_INFERENCE_PORT
        value: "8000"
      - name: VLLM_METRICS_PORT
        value: "8200"
      - name: VLLM_BLOCK_SIZE
        value: "32"
      - name: VLLM_MAX_MODEL_LEN
        value: "32768"
      - name: VLLM_LOAD_FORMAT
        value: "auto"
      - name: VLLM_ACCELERATOR_MEM_UTIL
        value: "0"
      - name: VLLM_MAX_NUM_SEQ
        value: "256"
      - name: VLLM_TENSOR_PARALLELISM
        value: "1"
      - name: VLLM_MAX_NUM_BATCHED_TOKENS
        value: "256"
      - name: VLLM_NIXL_SIDE_CHANNEL_HOST
        valueFrom:
          fieldRef:
            fieldPath: status.podIP
      - name: VLLM_NIXL_SIDE_CHANNEL_PORT
        value: "5557"
      - name: UCX_TLS
        value: "sm,cuda_ipc,cuda_copy,tcp"
      - name: UCX_SOCKADDR_TLS_PRIORITY
        value: "tcp"
      - name: POD_IP
        valueFrom:
          fieldRef:
            apiVersion: v1
            fieldPath: status.podIP
      - name: LLMDBENCH_POD_NS
        valueFrom:
          fieldRef:
            fieldPath: metadata.namespace
      - name: PYTHONPATH
        value: "/plugins"
      - name: VLLM_SIM_MULTIPROC_METHOD
        value: "spawn"
      - name: VLLM_ENABLE_V1_MULTIPROCESSING
        value: "0"
      - name: VLLM_CPU_KVCACHE_SPACE
        value: "1"
      - name: VLLM_CPU_OMP_THREADS_BIND
        value: "nobind"
      - name: OMP_NUM_THREADS
        value: "1"
      - name: HF_HOME
        value: "/tmp/huggingface"

    ports:
      - containerPort: 8000
        name: metrics
        protocol: TCP
    resources:
      limits:
        memory: 5Gi
        cpu: "2"
      requests:
        memory: 2Gi
        cpu: "250m"
    extraConfig:
      startupProbe:
        httpGet:
          path: /health
          port: 8000
        failureThreshold: 60
        initialDelaySeconds: 10
        periodSeconds: 5
        timeoutSeconds: 5
      livenessProbe:
        tcpSocket:
          port: 8000
        failureThreshold: 10
        periodSeconds: 5
        timeoutSeconds: 15
      readinessProbe:
        httpGet:
          path: /health
          port: 8000
        failureThreshold: 3
        periodSeconds: 5
        timeoutSeconds: 5
    volumeMounts:
      - name: dshm
        mountPath: /dev/shm
      - name: plugins
        mountPath: /plugins
      - name: vllm-sim-model-config
        mountPath: /model
        readOnly: true

  volumes:
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 500Mi
    - name: plugins
      emptyDir: {}
    - name: vllm-sim-model-config
      configMap:
        name: vllm-sim-npd-model-config

  monitoring:
    podmonitor:
      enabled: false

prefill:
  create: false

extraObjects:
  - apiVersion: v1
    data:
      config.json: |
        {
          "architectures": ["SimulatedForCausalLM"],
          "model_type": "qwen3",
          "hidden_size": 128,
          "num_hidden_layers": 1,
          "num_attention_heads": 1,
          "num_key_value_heads": 1,
          "head_dim": 128,
          "intermediate_size": 256,
          "vocab_size": 1024,
          "max_position_embeddings": 40960,
          "bos_token_id": 1,
          "eos_token_id": 1023,
          "torch_dtype": "bfloat16",
          "latency": {
            "type": "linear",
            "base_ms": 0.6,
            "prefill_ms_per_token": 0.02433,
            "decode_ms_per_seq": 0.0,
            "ctx_ms_per_ktoken": 0.05104,
            "deterministic_length": true
          }
        }
    kind: ConfigMap
    metadata:
      name: vllm-sim-npd-model-config
