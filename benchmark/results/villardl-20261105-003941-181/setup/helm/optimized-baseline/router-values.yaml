router:
  epp:
    extProcPort: 9002
    extraContainerPorts:
    - containerPort: 5557
      name: zmq
      protocol: TCP
    flags:
      v: '1'
    image:
      pullPolicy: Always
      registry: ghcr.io/llm-d
      repository: llm-d-router-endpoint-picker
      tag: v0.11.0
    pluginsConfigFile: default-plugins.yaml
    pluginsCustomConfig: {}
    replicas: 1
    resources:
      limits:
        cpu: '1'
        memory: 1Gi
      requests:
        cpu: 100m
        memory: 256Mi
    volumeMounts: []
    volumes: []
  extraServicePorts:
  - name: zmq
    port: 5557
    protocol: TCP
    targetPort: 5557
  - name: http
    port: 80
    protocol: TCP
    targetPort: 8081
  inferencePool:
    failureMode: FailOpen
  modelServers:
    matchLabels:
      llm-d.ai/inferenceServing: 'true'
      llm-d.ai/model: qwen-qwe-9117f9be-qwen3-8b
    targetPorts:
    - number: 8000
  monitoring:
    interval: 5s
    prometheus:
      auth:
        enabled: true
        secretName: inference-gateway-sa-metrics-reader-secret
      enabled: true
    secretName: inference-gateway-sa-metrics-reader-secret
  proxy:
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 50m
        memory: 128Mi
  tokenizer:
    enabled: false
