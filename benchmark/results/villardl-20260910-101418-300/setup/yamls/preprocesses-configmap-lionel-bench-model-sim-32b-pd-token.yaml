    # Set by the Jinja templates only when the labels originate from
    # `contextLengthRanges`, i.e. when routing correctness depends on them.
    pod_labels_required = os.environ.get("LLMDBENCH_POD_LABELS_REQUIRED", "").lower() in (
        "1",
        "true",
        "yes",
    )

    lws_leader_address = os.environ.get("LWS_LEADER_ADDRESS", None)

    usage = """usage: %prog [options] [command]
    """
    _parser = OptionParser(usage)

    _parser.add_option(
        "-d",
        "--debug",
        action="store_true",
        dest="debug",
        default=False,
        help="Display messages describing the output of discovery process on this pod",
    )

    _parser.add_option(
        "-e",
        "--envfile",
        dest="envfile",
        default=f"{Path.home()}/llmdbench_env.sh",
        help="name of the environment file generated (on user's home directory",
    )

    _parser.add_option(
        "-i",
        "--initcontainermode",
        action="store_true",
        dest="initcontainermode",
        default=False,
        help="if executed from an initContainer, just dump all commands to envfile for further execution",
    )

    _parser.add_option(
        "-o",
        "--omitenvvars",
        dest="omitenvvars",
        default="",
        help="List of environment variables which should be omitted",
    )

    _parser.set_defaults()
    (options, _args) = _parser.parse_args()

    options.envdir = options.envfile.replace("/llmdbench_env.sh", "")

    options.omitenvvars = options.omitenvvars.split(",")

    if options.initcontainermode:
        print(
            f'DEBUG: "initContainer mode" detected. Will write commands to {options.envfile}, instead of executing those'
        )

    if os.getenv("FLEX_DEVICE", "PF") == "VF":
        env_file_name = f"{Path.home()}/.senlib.json"
        if Path(env_file_name).is_file():
            print(
                f'INFO: Environment variable "FLEX_DEVICE" detected, will modify "{env_file_name}"'
            )
            with open(env_file_name, "r", encoding="utf-8") as senlib_file:
                senlib_contents = json.load(senlib_file)
            senlib_contents["RISCV"]["DOOM"]["enable"] = True
            with open(env_file_name, "w") as senlib_file:
                json.dump(senlib_contents, senlib_file, indent=4)
    result = None
    for dep in deps_present.keys():
        try:
            result = subprocess.run(
                ["which", dep], capture_output=True, text=True, check=True
            )
            deps_present[dep] = True
            executable_found_path = result.stdout.split("\n")[0]
            executable_found_name = executable_found_path.split("/")[-1]
            if dep.count(".sh"):
                shutil.copy2(
                    executable_found_path, f"{options.envdir}/{executable_found_name}"
                )
                if dep not in deps_to_copy:
                    deps_to_copy.append(dep)
        except subprocess.CalledProcessError as e:
            if os.access(executables_path, os.W_OK):
                print(
                    f'WARNING: Dependency "{dep}" not available on the image: {e.cmd} returned {e.returncode}. Trying to obtain externally...'
                )
                tool_cfgmap_fn = f"/setup/preprocess/{dep}.sh"
                if Path(tool_cfgmap_fn).is_file():
                    tool_image_fn = f"{executables_path}/{dep}"
                    if dep.count(".sh"):
                        shutil.copy2(tool_cfgmap_fn, tool_image_fn)
                        if dep not in deps_to_copy:
                            deps_to_copy.append(dep)
                    os.chmod(tool_image_fn, 0o755)
        try:
            result = subprocess.run(
                ["which", dep], capture_output=True, text=True, check=True
            )
            deps_present[dep] = True
            executable_found_path = result.stdout.split("\n")[0]
            executable_found_name = executable_found_path.split("/")[-1]
            if dep.count(".sh"):
