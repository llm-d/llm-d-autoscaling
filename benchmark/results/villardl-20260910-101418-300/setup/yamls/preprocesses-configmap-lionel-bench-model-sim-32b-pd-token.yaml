        file_name = f"{Path.home()}/.ip_route_info.json"
        with open(file_name, "w") as fh:
            json.dump(ip_route_info, fh)

        file_name = f"{Path.home()}/.device_to_network.json"
        with open(file_name, "w") as fh:
            json.dump(ip_route_info, fh)

    if deps_present["show_gids.sh"]:
