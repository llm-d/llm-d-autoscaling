    for gidnum in gid_to_device.keys():
        if len(gid_to_device[gidnum]) == s_gid_len:
            if gidnum not in s_gid:
                s_gid.append(gidnum)

    if options.debug:
        print(f"{'-' * 20} ip_info {'-' * 20}")
