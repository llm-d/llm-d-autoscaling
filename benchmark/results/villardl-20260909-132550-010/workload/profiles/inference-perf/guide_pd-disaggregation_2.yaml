load:
  type: constant
  stages:
  - rate: 1
    duration: 120
    num_requests: null
    concurrency_level: null
  num_workers: 100
  worker_max_concurrency: 100
api:
  type: completion
  streaming: true
server:
  type: vllm
  model_name: Qwen/Qwen3-32B
  base_url: http://172.30.128.7:80
  ignore_eos: true
tokenizer:
  pretrained_model_name_or_path: Qwen/Qwen3-32B
data:
  type: random
  input_distribution:
    min: 1024
    max: 1024
    mean: 1024
    std_dev: 0
  output_distribution:
    min: 1024
    max: 1024
    mean: 1024
    std_dev: 0
report:
  request_lifecycle:
    summary: true
    per_stage: true
    per_request: true
storage:
  local_storage:
    path: /workspace
