function wireSpecDetailLaunchHandlers(specId) {
  wireHarnessWorkloadSelect('nr-harness', 'nr-workload');

  function target() {
    return {
      spec: specId,
      clusterConfig: document.getElementById('nr-cluster-config').value,
      namespace: document.getElementById('nr-namespace').value.trim(),
      dryRun: document.getElementById('nr-dry-run').checked,
    };
  }
  function withWorkload() {
    return { ...target(), harness: document.getElementById('nr-harness').value, workload: document.getElementById('nr-workload').value };
  }

  document.getElementById('nr-all-btn').addEventListener('click', () => launchAction('all', withWorkload()));
  document.getElementById('nr-standup-btn').addEventListener('click', () => launchAction('standup', target()));
  document.getElementById('nr-teardown-btn').addEventListener('click', () => launchAction('teardown', target()));
  document.getElementById('nr-run-btn').addEventListener('click', () => launchAction('run', withWorkload()));
}

function commandLine(verb, t) {
  const parts = ['llmdbenchmark', verb, '--spec', t.spec, '--cluster-config', t.clusterConfig,
    '--workspace', 'benchmark/results', '-p', t.namespace || '<namespace>'];
  if (verb === 'run') {
    parts.push('-l', t.harness || '<harness>');
    const w = t.harness && t.workload ? findWorkload(t.harness, t.workload) : null;
    if (w && w.local) parts.push('--workload-file-path', w.path);
    else parts.push('-w', t.workload || '<workload>');
  }
  if (t.dryRun && verb !== 'teardown') parts.push('--dry-run');
  return parts.join(' ');
}
function commandPreview(action, t) {
  if (action === 'all') return ['standup', 'smoketest', 'run'].map(v => commandLine(v, t)).join('\n');
  return commandLine(action, t);
}

async function launchAction(action, target, opts = {}) {
  const prefix = opts.prefix || 'nr';
  if (!target.namespace) { alert('Namespace is required.'); return; }
  if ((action === 'run' || action === 'all') && (!target.harness || !target.workload)) { alert('Pick a harness and a workload.'); return; }

  const cmd = commandPreview(action, target);
  const consequence = action === 'teardown'
    ? 'This removes real cluster resources. This cannot be undone.'
    : target.dryRun
      ? 'Dry run: renders locally, no cluster writes.'
      : action === 'all'
        ? 'This creates/modifies real cluster resources, and stops automatically if standup or smoketest fails.'
        : 'This creates/modifies real cluster resources.';
  if (!confirm(`Run this against cluster context "${META.kube_context || 'unknown'}"?\n\n${cmd}\n\n${consequence}`)) return;

  const statusEl = document.getElementById(`${prefix}-${action}-status`);
  statusEl.textContent = 'Launching…';
  statusEl.className = 'launch-status';
  try {
    const res = await fetch('api/launch', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action, ...target }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
    statusEl.textContent = data.pid
      ? `Launched (pid ${data.pid}). It'll show up in Sessions shortly.`
      : `Launched. Each phase will show up in Sessions as it starts.`;
    if (opts.afterHash) {
      setTimeout(() => { location.hash = opts.afterHash; loadManifest(false); }, 2000);
    } else {
      setTimeout(() => loadManifest(false), 2000);
    }
  } catch (e) {
    statusEl.textContent = 'Failed: ' + e.message;
    statusEl.className = 'launch-status error';
  }
}

async function createSnapshot(exp, statusEl, btn) {
  statusEl.textContent = 'Capturing…';
  statusEl.className = 'launch-status';
  btn.disabled = true;
  try {
    const res = await fetch('api/snapshot', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ dir: exp.dir }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
    statusEl.textContent = 'Snapshot captured.';
    setTimeout(() => loadManifest(true), 1200);
  } catch (e) {
    statusEl.textContent = 'Failed: ' + e.message;
    statusEl.className = 'launch-status error';
    btn.disabled = false;
  }
}

async function deleteSession(session) {
  const warning = session.is_latest ? "\n\nNote: this is the 'latest' session -- its symlink will become dangling." : '';
  if (!confirm(`Permanently delete ${session.id} from disk?\n\nThis removes its logs, plan, and results. It does not affect cluster resources -- run teardown separately if needed. This cannot be undone.${warning}`)) {
    return;
  }
  try {
    const res = await fetch(resultsUrl(session.id), { method: 'DELETE' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    location.hash = session.scenario_spec ? '#/spec/' + encodeURIComponent(session.scenario_spec) : '#/';
    await loadManifest(false);
  } catch (e) {
    alert('Failed to delete ' + session.id + ': ' + e.message);
  }
}

async function loadManifest(preserveScroll) {
  const scrollY = preserveScroll ? window.scrollY : 0;
  try {
    const res = await fetch('index.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    MANIFEST = await res.json();
    document.getElementById('workspace-info').textContent =
      `workspace: ${MANIFEST.workspace} · updated ${fmtRelative(MANIFEST.generated_at)}`;
    render();
    if (preserveScroll) window.scrollTo(0, scrollY);
  } catch (e) {
    document.getElementById('app').innerHTML = `<div class="load-error">
      Could not load <code>index.json</code> (${esc(e.message)}).<br><br>
      This page must be served by <code>benchmark/hack/benchmark_report.py serve</code>
      (or <code>benchmark_report.sh serve</code>) -- opening it directly as a <code>file://</code> URL won't work.
    </div>`;
  }
}

/* ---- system-status strip: current cluster / Prometheus / Grafana, local vs remote ------
   The cluster's kube context is pinned server-side at startup (see build_cluster_status in
   benchmark_report.py) so it doesn't drift if `kubectl config use-context` runs elsewhere;
   `context_drifted` surfaces that instead of silently following it. Prometheus/Grafana each
   get a port-forward picker (gear icon) backed by GET /api/port-forward/discover, since
   auto-discovery can miss the right Service or a cluster can have more than one. ---- */
let SYS_STATUS = null;
let PF_PANEL_TARGET = null; // 'prometheus' | 'grafana' | null
const PF_DISCOVERED = {}; // target -> { loading, services, error }

async function loadSystemStatus() {
  try {
    const res = await fetch('system-status.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    SYS_STATUS = await res.json();
  } catch (e) {
    SYS_STATUS = null;
  }
  renderSystemStatus();
}

function sysChip(label, ok, detail, location, extraHtml) {
  const tone = ok ? 'good' : 'critical';
  const locTag = location && location !== 'unknown' ? `<span class="loc">${esc(location)}</span>` : '';
  return `<span class="sys-chip tone-${tone}" title="${esc(detail)}"><span class="dot"></span>${esc(label)} ${locTag}${extraHtml || ''}</span>`;
}

function pfGear(target) {
  return `<button class="pf-gear" type="button" data-target="${target}" title="Configure port-forward">&#9881;</button>`;
}

function renderSystemStatus() {
  const mount = document.getElementById('sys-status');
  if (!mount) return;
  if (!SYS_STATUS) { mount.innerHTML = ''; renderPfPanel(); return; }
  const { cluster, prometheus, grafana } = SYS_STATUS;

  const clusterDetail = cluster.context
    ? `context: ${cluster.context}${cluster.server ? '\n' + cluster.server : ''}${cluster.reachable ? '' : '\n(unreachable)'}`
      + (cluster.context_drifted ? '\n`kubectl config current-context` has changed since this server started -- restart it to follow that.' : '')
    : 'No active kube context found (is kubectl/oc on PATH?)';
  const promDetail = `${prometheus.url}${prometheus.reachable ? '' : ' (unreachable)'}`;
  const grafanaDetail = `${grafana.url}${grafana.version ? ' (v' + grafana.version + ')' : ''}${grafana.reachable ? '' : ' (unreachable)'}`;

  mount.innerHTML =
    sysChip('Cluster', cluster.reachable, clusterDetail, cluster.location, cluster.context_drifted ? '<span class="drift-flag" title="Context changed elsewhere">&#9888;</span>' : '') +
    sysChip('Prometheus', prometheus.reachable, promDetail, prometheus.location, prometheus.port_forward && prometheus.port_forward.supported ? pfGear('prometheus') : '') +
    sysChip('Grafana', grafana.reachable, grafanaDetail, grafana.location, grafana.port_forward && grafana.port_forward.supported ? pfGear('grafana') : '');

  mount.querySelectorAll('.pf-gear').forEach(btn => {
    btn.addEventListener('click', () => togglePfPanel(btn.dataset.target));
  });

  renderPfPanel();

  // The session page's Prometheus link is built from prometheus.url above, which may not
  // have loaded yet when that page first painted -- backfill it once it has.
  if (route.view === 'session') {
    const session = MANIFEST.sessions.find(s => s.id === route.id);
    if (session) renderSessionObservability(session);
  }
}

function togglePfPanel(target) {
  PF_PANEL_TARGET = (PF_PANEL_TARGET === target) ? null : target;
  const panel = document.getElementById('pf-panel');
  if (panel) delete panel.dataset.target; // force a full rebuild for the new target
  if (PF_PANEL_TARGET && !PF_DISCOVERED[PF_PANEL_TARGET]) discoverServices(PF_PANEL_TARGET);
  renderPfPanel();
}

async function discoverServices(target) {
  PF_DISCOVERED[target] = { loading: true, services: [], error: null };
  renderPfPanel();
  try {
    const res = await fetch(`api/port-forward/discover?target=${encodeURIComponent(target)}`, { cache: 'no-store' });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
    PF_DISCOVERED[target] = { loading: false, services: data.services || [], error: null };
  } catch (e) {
    PF_DISCOVERED[target] = { loading: false, services: [], error: e.message };
  }
  const panel = document.getElementById('pf-panel');
  if (panel) delete panel.dataset.target; // discovery just landed -- rebuild the select
  renderPfPanel();
}

// Rebuilds the picker form only when it's freshly opened or discovery just landed (tracked
// via panel.dataset.target); a periodic system-status poll just patches the live bits
// (start/stop buttons, status line) so it doesn't wipe out a namespace/service the operator
// is mid-typing into the manual override fields.
function renderPfPanel() {
  const panel = document.getElementById('pf-panel');
  if (!panel) return;
  if (!PF_PANEL_TARGET || !SYS_STATUS) {
    panel.className = 'pf-panel hidden';
    panel.innerHTML = '';
    delete panel.dataset.target;
    return;
  }
  const target = PF_PANEL_TARGET;
  const pf = SYS_STATUS[target].port_forward;

  if (panel.dataset.target === target && document.getElementById('pf-ns')) {
    document.getElementById('pf-start-btn').disabled = !!(pf && pf.active);
    document.getElementById('pf-stop-btn').disabled = !(pf && pf.active);
    const statusEl = document.getElementById('pf-status');
    if (pf && pf.active) statusEl.textContent = `Forwarding ${pf.namespace}/${pf.service} → localhost:${pf.local_port}`;
    else if (pf && pf.error) statusEl.textContent = 'Failed: ' + pf.error;
    return;
  }

  panel.dataset.target = target;
  panel.className = 'pf-panel';
  const discovered = PF_DISCOVERED[target] || { loading: true, services: [] };
  const services = discovered.services || [];
  const optionsHtml = services
    .map(s => `<option value="${esc(s.namespace)}|${esc(s.name)}|${s.port}" ${s.caution ? `title="${esc(s.caution)}"` : ''}>${s.caution ? '⚠ ' : ''}${esc(s.namespace)}/${esc(s.name)}:${s.port}</option>`)
    .join('');
  const pickerHtml = discovered.loading
    ? `<span class="hint">Discovering ${esc(target)} services…</span>`
    : discovered.error
      ? `<span class="hint" style="color:var(--status-critical)">${esc(discovered.error)}</span>`
      : optionsHtml
        ? `<select id="pf-svc-select">${optionsHtml}</select>`
        : `<span class="hint">No ${esc(target)} Service auto-detected — enter one manually.</span>`;

  const active = pf && pf.active;
  const currentNs = (pf && pf.namespace) || '';
  const currentSvc = (pf && pf.service) || '';
  const currentPort = (pf && pf.remote_port) || (target === 'prometheus' ? 9090 : 3000);

  panel.innerHTML = `
    <span class="pf-panel-title">${target === 'prometheus' ? 'Prometheus' : 'Grafana'} port-forward</span>
    ${pickerHtml}
    <span class="pf-manual">
      <input type="text" id="pf-ns" placeholder="namespace" value="${esc(currentNs)}">
      <input type="text" id="pf-svc" placeholder="service" value="${esc(currentSvc)}">
      <input type="number" id="pf-port" placeholder="port" value="${currentPort}">
    </span>
    <button class="btn primary" id="pf-start-btn" type="button" ${active ? 'disabled' : ''}>Start</button>
    <button class="btn danger" id="pf-stop-btn" type="button" ${active ? '' : 'disabled'}>Stop</button>
    <button class="btn" id="pf-refresh-btn" type="button">Re-scan</button>
    <button class="btn" id="pf-close-btn" type="button">Close</button>
    <span class="launch-status" id="pf-status">${active ? `Forwarding ${esc(currentNs)}/${esc(currentSvc)} → localhost:${pf.local_port}` : (pf && pf.error ? 'Failed: ' + esc(pf.error) : '')}</span>
    <div class="pf-caution hidden" id="pf-caution" style="flex-basis:100%"></div>
  `;

  function updateCaution(namespace, name) {
    const match = services.find(s => s.namespace === namespace && s.name === name);
    const el = document.getElementById('pf-caution');
    if (match && match.caution) {
      el.textContent = '⚠ ' + match.caution;
      el.className = 'hint';
      el.style.color = 'var(--status-warning)';
    } else {
      el.textContent = '';
      el.className = 'hidden';
    }
  }

  const select = document.getElementById('pf-svc-select');
  if (select) {
    select.addEventListener('change', () => {
      const [ns, svc, port] = select.value.split('|');
      document.getElementById('pf-ns').value = ns;
      document.getElementById('pf-svc').value = svc;
      document.getElementById('pf-port').value = port;
      updateCaution(ns, svc);
    });
    if (!currentSvc) select.dispatchEvent(new Event('change'));
    else updateCaution(currentNs, currentSvc);
  }

  document.getElementById('pf-start-btn').addEventListener('click', () => startPortForward(target));
  document.getElementById('pf-stop-btn').addEventListener('click', () => stopPortForward(target));
  document.getElementById('pf-refresh-btn').addEventListener('click', () => discoverServices(target));
  document.getElementById('pf-close-btn').addEventListener('click', () => { PF_PANEL_TARGET = null; renderPfPanel(); });
}

async function startPortForward(target) {
  const namespace = document.getElementById('pf-ns').value.trim();
  const service = document.getElementById('pf-svc').value.trim();
  const port = Number(document.getElementById('pf-port').value);
  const statusEl = document.getElementById('pf-status');
  if (!namespace || !service || !port) { statusEl.textContent = 'Namespace, service, and port are required.'; return; }
  statusEl.textContent = 'Starting…';
  try {
    const res = await fetch('api/port-forward/start', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ target, namespace, service, port }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
    statusEl.textContent = `Forwarding ${namespace}/${service} → localhost:${data.local_port}`;
    setTimeout(loadSystemStatus, 800);
  } catch (e) {
    statusEl.textContent = 'Failed: ' + e.message;
  }
}

async function stopPortForward(target) {
  const statusEl = document.getElementById('pf-status');
  statusEl.textContent = 'Stopping…';
  try {
    const res = await fetch('api/port-forward/stop', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ target }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
    statusEl.textContent = 'Stopped.';
    setTimeout(loadSystemStatus, 400);
  } catch (e) {
    statusEl.textContent = 'Failed: ' + e.message;
  }
}

function wireTheme() {
  const btn = document.getElementById('theme-toggle');
  const cycle = ['auto', 'light', 'dark'];
  let i = 0;
  btn.addEventListener('click', () => {
    i = (i + 1) % cycle.length;
    const mode = cycle[i];
    if (mode === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', mode);
    btn.textContent = 'Theme: ' + mode[0].toUpperCase() + mode.slice(1);
  });
}

function wireAutoRefresh() {
  const checkbox = document.getElementById('auto-refresh');
  let statusTimer = null;
  function apply() {
    if (autoRefreshTimer) clearInterval(autoRefreshTimer);
    if (statusTimer) clearInterval(statusTimer);
    if (checkbox.checked) {
      autoRefreshTimer = setInterval(() => loadManifest(true), 8000);
      statusTimer = setInterval(loadSystemStatus, 15000);
    }
  }
  checkbox.addEventListener('change', apply);
  apply();
}

/* ---- init ---------------------------------------------------------------------- */
route = parseHash();
document.getElementById('refresh-btn').addEventListener('click', () => { loadManifest(true); loadSystemStatus(); });
wireTheme();
wireAutoRefresh();
loadManifest(false);
loadSystemStatus();
</script>
