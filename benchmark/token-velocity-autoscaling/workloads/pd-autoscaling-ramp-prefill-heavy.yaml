# Prefill-heavy staged autoscaling ramp for the token-aware P/D experiment.
# Sibling of pd-autoscaling-ramp.yaml (balanced ISL/OSL 2048). This variant makes each
# request prefill-dominated (ISL 8192 / OSL 256, 32:1) so it exercises the PREFILL trigger
# (inflight_tokens / V_P) while leaving decode KV-occupancy nearly idle.
#
# Rates are rescaled to the larger per-request prefill cost. With V_P = 2696 tok/s per
# prefill replica and ISL 8192, one replica saturates at QPS = V_P/ISL = 2696/8192 ~= 0.33
# req/s. The stages walk across 1 -> 4 replicas and back; the peak (rate 1.4 -> 11469 offered
# input tok/s) exceeds 4 x V_P = 10784, so prefill pegs at --max and builds real backlog.
# Same 7-stage / 3420 s shape as the balanced ramp for comparability.
#
# Derived from llm-d-benchmark guide_pd-disaggregation_2.yaml.in (placeholders intact,
# so the CLI resolves model_name/base_url the same way it does for shipped profiles).
# Only load.stages and the token distributions differ. See README.md -> Experiment.
load:
  type: constant
  stages:
  - rate: 0.15
    duration: 300
    num_requests: null
    concurrency_level: null
  - rate: 0.30
    duration: 300
    num_requests: null
    concurrency_level: null
  - rate: 0.50
    duration: 420
    num_requests: null
    concurrency_level: null
  - rate: 0.80
    duration: 600
    num_requests: null
    concurrency_level: null
  - rate: 1.40
    duration: 600
    num_requests: null
    concurrency_level: null
  - rate: 0.50
    duration: 300
    num_requests: null
    concurrency_level: null
  - rate: 0.15
    duration: 900
    num_requests: null
    concurrency_level: null
  num_workers: 64
  worker_max_concurrency: 100
api:
  type: completion
  streaming: true
server:
  type: vllm
  model_name: REPLACE_ENV_LLMDBENCH_DEPLOY_CURRENT_MODEL
  base_url: REPLACE_ENV_LLMDBENCH_HARNESS_STACK_ENDPOINT_URL
  ignore_eos: true
tokenizer:
  pretrained_model_name_or_path: REPLACE_ENV_LLMDBENCH_DEPLOY_CURRENT_MODEL
data:
  type: random
  input_distribution:
    min: 8192
    max: 8192
    mean: 8192
    std_dev: 0
  output_distribution:
    min: 256
    max: 256
    mean: 256
    std_dev: 0
report:
  request_lifecycle:
    summary: true
    per_stage: true
    per_request: true
storage:
  local_storage:
    path: /workspace
