apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: model-b-scaler
  namespace: llm-d-sim
  annotations:
    llm-d.ai/managed: "true"
    llm-d.ai/model-id: "model-b"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: model-b-decode
  minReplicaCount: 1
  maxReplicaCount: 10
  pollingInterval: 5
  cooldownPeriod: 120
  advanced:
    horizontalPodAutoscalerConfig:
      name: model-b-hpa
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Pods
              value: 4
              periodSeconds: 15
        scaleDown:
          stabilizationWindowSeconds: 120
          policies:
            - type: Percent
              value: 100
              periodSeconds: 30
  triggers:
    - type: prometheus
      name: model-b-epp-queue
      metadata:
        serverAddress: https://kube-prometheus-stack-prometheus.workload-variant-autoscaler-monitoring.svc.cluster.local:9090
        query: sum(inference_extension_flow_control_queue_size{inference_pool="model-b"})
        threshold: "1"
        activationThreshold: "0"
        metricType: Value
        # The kind Prometheus endpoint uses a self-signed certificate.
        unsafeSsl: "true"
