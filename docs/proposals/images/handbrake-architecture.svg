<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470"
     role="img" aria-labelledby="t d"
     font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">GPU-free overprovisioning: the four components</title>
  <desc id="d">KEDA sizes the vLLM Deployment to active pods plus a buffer. The Deployment holds
  active pods, which hold a GPU lease and serve traffic, and buffer pods, which are parked before
  the first CUDA context and hold no GPU. A new llm-d-router screener keeps traffic off the buffer
  pods. A new handbrake controller labels, relocates, promotes and re-parks them, taking per-node
  GPU leases. Kueue optionally holds the per-node budget.</desc>

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect width="1000" height="470" fill="#fbfbfa"/>

  <!-- how many replicas -->
  <rect x="60" y="26" width="120" height="38" rx="5" fill="#ffffff" stroke="#d0d7de"/>
  <text x="120" y="50" text-anchor="middle" font-size="12.5" fill="#1f2328">Prometheus</text>
  <line x1="182" y1="45" x2="206" y2="45" stroke="#57606a" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="210" y="26" width="300" height="38" rx="5" fill="#ffffff" stroke="#d0d7de"/>
  <text x="360" y="50" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2328">KEDA ScaledObject · scalingModifiers</text>
  <text x="360" y="83" text-anchor="middle" font-size="11.5" fill="#6e7781">replicas = ceil(demand / capacity) + buffer</text>
  <line x1="360" y1="93" x2="360" y2="117" stroke="#57606a" stroke-width="1.4" marker-end="url(#ah)"/>

  <!-- the deployment -->
  <rect x="60" y="120" width="580" height="182" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-dasharray="5 4"/>
  <text x="78" y="147" font-size="12.5" font-weight="600" fill="#1f2328">vLLM Deployment</text>
  <text x="190" y="147" font-size="11" fill="#6e7781">— one manifest; handbrake injected into every pod</text>

  <rect x="80" y="166" width="250" height="120" rx="5" fill="#fff4e5" stroke="#e8c893"/>
  <rect x="276" y="174" width="44" height="17" rx="8.5" fill="#fdebd0" stroke="#e8c893"/>
  <text x="298" y="186" text-anchor="middle" font-size="9.5" font-weight="700" letter-spacing="0.5" fill="#9a5b0a">GPU</text>
  <text x="205" y="199" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">active pods</text>
  <text x="205" y="223" text-anchor="middle" font-size="11" fill="#57606a">hold a GPU lease</text>
  <text x="205" y="241" text-anchor="middle" font-size="11" fill="#57606a">serving traffic</text>

  <rect x="360" y="166" width="260" height="120" rx="5" fill="#eaf5ef" stroke="#a8cdb8"/>
  <rect x="548" y="174" width="58" height="17" rx="8.5" fill="#ddeee4" stroke="#a8cdb8"/>
  <text x="577" y="186" text-anchor="middle" font-size="9.5" font-weight="700" letter-spacing="0.5" fill="#2f6f4f">NO GPU</text>
  <text x="490" y="199" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">buffer pods</text>
  <text x="490" y="223" text-anchor="middle" font-size="11" fill="#57606a">parked before first CUDA context</text>
  <text x="490" y="241" text-anchor="middle" font-size="11" fill="#57606a">warm · no GPU · no traffic</text>

  <!-- which pods serve -->
  <rect x="60" y="352" width="280" height="72" rx="5" fill="#ffffff" stroke="#d0d7de"/>
  <text x="78" y="377" font-size="12.5" font-weight="600" fill="#1f2328">llm-d-router EPP</text>
  <rect x="196" y="364" width="38" height="16" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="215" y="375.5" text-anchor="middle" font-size="9" font-weight="700" letter-spacing="0.5" fill="#4338ca">NEW</text>
  <text x="78" y="400" font-size="11" fill="#57606a">buffer screener — mandatory, every profile</text>
  <line x1="200" y1="350" x2="200" y2="292" stroke="#57606a" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="208" y="325" font-size="10.5" fill="#57606a">traffic</text>
  <path d="M340,388 H490 V300" fill="none" stroke="#b42318" stroke-width="1.3" stroke-dasharray="4 3"/>
  <g stroke="#b42318" stroke-width="2">
    <line x1="485" y1="291" x2="495" y2="301"/><line x1="495" y1="291" x2="485" y2="301"/>
  </g>
  <text x="415" y="381" text-anchor="middle" font-size="10.5" fill="#b42318">no traffic</text>

  <!-- which pod gets a GPU -->
  <rect x="660" y="120" width="320" height="182" rx="5" fill="#ffffff" stroke="#d0d7de"/>
  <text x="678" y="149" font-size="13" font-weight="600" fill="#1f2328">handbrake controller</text>
  <rect x="826" y="136" width="38" height="16" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="845" y="147.5" text-anchor="middle" font-size="9" font-weight="700" letter-spacing="0.5" fill="#4338ca">NEW</text>
  <g font-size="11" fill="#57606a">
    <text x="678" y="180">· labels which pods are buffers</text>
    <text x="678" y="204">· relocates them to nodes with free GPUs</text>
    <text x="678" y="228">· promotes: take a lease, then resume</text>
    <text x="678" y="252">· re-parks when a lease is revoked</text>
    <text x="678" y="276">· biases scale-down away from active pods</text>
  </g>
  <line x1="658" y1="226" x2="624" y2="226" stroke="#57606a" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="820" y1="304" x2="820" y2="348" stroke="#57606a" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah)"/>
  <text x="828" y="330" font-size="10.5" fill="#57606a">lease</text>

  <rect x="700" y="352" width="280" height="48" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-dasharray="4 3"/>
  <text x="840" y="373" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2328">Kueue <tspan font-weight="400" font-size="11" fill="#6e7781">(optional)</tspan></text>
  <text x="840" y="391" text-anchor="middle" font-size="10.5" fill="#6e7781">per-node GPU quota</text>

  <text x="840" y="420" text-anchor="middle" font-size="10.5" fill="#6e7781">pods request no GPU — the lease names the device</text>
  <text x="500" y="450" text-anchor="middle" font-size="10.5" fill="#8c959f">green: holds no GPU   ·   amber: holds a GPU   ·   NEW: to be built</text>
</svg>
