# M1 — Scheduled batch window: scale the model server 0<->N on a cron
# schedule. Requests enqueued outside the window are held in the broker by
# llm-d-async's fail-closed dispatch gate (see worker-pools-readiness-gate.json)
# and drain when the window opens.
#
# N is a fixed replica count for the window (desiredReplicas), sized by the
# operator for the expected batch — not derived from backlog (that is M2).
# The cron trigger accepts any integer, so 0<->N costs nothing beyond 0<->1.
#
# Before applying: set timezone/start/end for your schedule and N. On clusters
# with on-demand accelerator provisioning (DWS flex-start, spot), start the
# window one measured cold-start early — provisioning happens inside the
# window, and all N replicas are requested at once (watch accelerator quota).
# GPU-minutes budget = N * (window length + cooldownPeriod).
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: vllm-batch-window
  namespace: llm-d-async
spec:
  scaleTargetRef:
    name: vllm
  minReplicaCount: 0
  maxReplicaCount: 3 # ceiling; must be >= desiredReplicas
  cooldownPeriod: 60 # window end is authoritative; don't idle GPUs for the 300s default
  triggers:
  - type: cron
    metadata:
      timezone: Etc/UTC
      start: "0 2 * * *"
      end: "0 4 * * *"
      desiredReplicas: "3" # fixed N for the window
